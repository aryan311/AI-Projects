[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filewise"
version = "0.1.0"
description = "Citation-first RAG chatbot for uploaded files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ketan Khairnar" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
sbert = ["sentence-transformers>=2.5"]
openai = ["openai>=1.12"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "hypothesis>=6.98",
    "ruff>=0.3",
    "mypy>=1.9",
    "coverage>=7.4",
    "pyyaml>=6.0",
    "fpdf2>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/filewise"]

[tool.hatch.build.targets.wheel.force-include]
"src/filewise/ui/index.html" = "filewise/ui/index.html"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/filewise"]
plugins = []

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not sbert and not live'"
asyncio_mode = "auto"
markers = [
    "sbert: requires sentence-transformers and downloads a real model",
    "live: spins up a real uvicorn process and exercises it over HTTP",
]

[tool.coverage.run]
source = ["src/filewise"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
