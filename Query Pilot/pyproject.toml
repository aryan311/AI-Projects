[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "querypilot"
version = "0.1.0"
description = "A Python FastAPI service that lets users ask plain English questions against a Dockerized PostgreSQL database."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psycopg[binary,pool]>=3.1.18",
    "httpx>=0.27.0",
    "sqlglot>=23.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

