[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codewalk"
version = "0.1.0"
description = "A Python code explanation tool using AST static analysis and optional LLM integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
codewalk = "codewalk.cli:app"

[tool.setuptools.packages.find]
include = ["codewalk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
